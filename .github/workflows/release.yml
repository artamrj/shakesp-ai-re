name: Release desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: shakespAIre v__VERSION__
          releaseBody: Download the installer for your operating system from the assets below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package portable Windows test build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $portableDirectory = "portable/shakespAIre"
          New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
          Copy-Item "src-tauri/target/release/shakespaire.exe" "$portableDirectory/shakespAIre.exe"
          Set-Content -Path "$portableDirectory/README.txt" -Value @"
          shakespAIre portable test build

          Run shakespAIre.exe directly. Installation and administrator rights are not required.
          Microsoft Edge WebView2 must already be installed on the computer.

          This build is not digitally signed. Endpoint security software may still inspect or block it.
          Do not disable endpoint protection; ask your IT/security administrator to review the file.
          "@
          Compress-Archive -Path "$portableDirectory/*" -DestinationPath "portable/shakespAIre-windows-x64-portable.zip" -Force

      - name: Upload portable Windows test build
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: shakespAIre-windows-x64-portable
          path: portable/shakespAIre-windows-x64-portable.zip
          if-no-files-found: error

      - name: Attach portable Windows test build to draft release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          gh release upload "app-v$version" "portable/shakespAIre-windows-x64-portable.zip" --clobber
