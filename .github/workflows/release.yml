name: Build installers

# Builds the installers for a tag and attaches them to its (draft) GitHub release.
# Called by release-please.yml; can also be run by hand to rebuild an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.0
        required: true
        type: string

jobs:
  # The three platform builds all upload to the same release. If it does not exist yet they would
  # race to create it and the losers fail, so create it once, first. Nothing happens if
  # release-please (or an earlier run) already made it.
  prepare:
    name: Make sure the draft release exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the draft release if it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "shakespAIre $TAG" --notes "Installers for $TAG."
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # Save the compiled dependencies even if a later step fails (for example signing or
          # upload), so a retry does not start from zero.
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      # No type-check or test steps here: CI (ci.yml) already gates every merge to main, and
      # releases are built from main, so repeating them only adds minutes to every platform.

      - name: Build installers and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. Required because the build produces updater artifacts;
          # the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Normally the release and its notes already exist (created by release-please) and this
          # only uploads the installers to it, keeping it a draft until published.
          tagName: ${{ inputs.tag }}
          # Only used if the release does not exist yet (a manual run); release-please normally
          # creates it first. The tool refuses to create a release without a name.
          releaseName: shakespAIre ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          # Uploads the signed update files and the latest.json the app checks.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
