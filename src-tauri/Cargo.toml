[package]
name = "shakesp-ai-re"
version = "0.2.1"
description = "AI for any selected text, anywhere, with one shortcut."
authors = ["Arta"]
edition = "2021"

[lib]
name = "shakesp_ai_re_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["stream", "json"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process"] }
tokio-stream = "0.1"
log = "0.4"
env_logger = "0.11"
keyring = "4.1.6"
dirs-next = "2.0"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
block2 = "0.6"
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc2-app-kit = "0.3"
window-vibrancy = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }
window-vibrancy = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
